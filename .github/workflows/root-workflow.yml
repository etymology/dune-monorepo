name: Root Workflow

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Add uv to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config python3-tk

      - name: Sync workspace
        run: uv sync

      - name: Import smoke test
        run: |
          uv run python -c "import dune_tension, dune_winder, spectrum_analysis"
          uv run python -c "from dune_winder import acd_export_l5x, plc_l5x"

      - name: Run tests
        run: uv run pytest

      - name: Run ruff
        run: uv run ruff check src tests
